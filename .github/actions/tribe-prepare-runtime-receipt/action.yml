name: Prepare Tribe platform runtime receipt
description: Decode and verify commit-bound AWG/Xray device evidence for a store build

inputs:
  platform:
    description: Platform identity accepted by the runtime-receipt contract
    required: true
  receipt-base64:
    description: Base64-encoded reviewed platform runtime receipt
    required: true
  receipt-sha256:
    description: Independently pinned lowercase SHA-256 of the receipt
    required: true

outputs:
  file:
    description: Absolute path of the verified receipt
    value: ${{ steps.prepare.outputs.file }}

runs:
  using: composite
  steps:
    - id: prepare
      shell: bash
      env:
        TRIBE_RECEIPT_PLATFORM: ${{ inputs.platform }}
        TRIBE_RECEIPT_BASE64: ${{ inputs.receipt-base64 }}
        TRIBE_RECEIPT_SHA256: ${{ inputs.receipt-sha256 }}
      run: |
        set -euo pipefail
        receipt_file="${RUNNER_TEMP}/tribe-platform-runtime-${TRIBE_RECEIPT_PLATFORM}.json"
        python3 - "$receipt_file" <<'PY'
        import base64
        import binascii
        import os
        import pathlib
        import sys

        encoded = os.environ.get("TRIBE_RECEIPT_BASE64", "")
        if not encoded:
            raise SystemExit("platform runtime receipt secret is empty")
        try:
            raw = base64.b64decode(encoded, validate=True)
        except (binascii.Error, ValueError) as error:
            raise SystemExit("platform runtime receipt secret is not canonical base64") from error
        if not raw:
            raise SystemExit("platform runtime receipt decoded to an empty file")
        path = pathlib.Path(sys.argv[1])
        path.write_bytes(raw)
        path.chmod(0o600)
        PY
        python3 "${GITHUB_WORKSPACE}/metadata/check_platform_runtime_receipt.py" \
          --file "$receipt_file" \
          --sha256 "$TRIBE_RECEIPT_SHA256" \
          --platform "$TRIBE_RECEIPT_PLATFORM" \
          --source-root "$GITHUB_WORKSPACE"
        echo "file=$receipt_file" >> "$GITHUB_OUTPUT"
