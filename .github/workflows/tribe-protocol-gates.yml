name: Tribe protocol agility gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tribe-protocol-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client-contract-and-policy:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Fetch audited Amnezia upstream snapshot
        shell: bash
        run: |
          git fetch --no-tags https://github.com/amnezia-vpn/amnezia-client.git \
            dev:refs/tribe-audit/amnezia-dev

      - name: Enforce bounded upstream overlay seams
        shell: bash
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 metadata/check_upstream_overlay_budget.py \
            --upstream-ref refs/tribe-audit/amnezia-dev

      - uses: jurplel/install-qt-action@v3
        with:
          version: "6.11.1"
          host: mac
          target: desktop
          arch: clang_64
          modules: "qtremoteobjects qt5compat"
          setup-python: false
          cache: true

      - name: Run catalog, transport, supply-chain and release-receipt gates
        shell: bash
        run: |
          if [[ -z "${QT_ROOT_DIR:-}" ]]; then
            QT_ROOT_DIR="$(qmake -query QT_INSTALL_PREFIX)"
          fi
          export QT_ROOT="$QT_ROOT_DIR"
          OPENSSL_ROOT="$(brew --prefix openssl@3)"
          export OPENSSL_ROOT
          bash metadata/run_tribe_release_gates.sh --source-only
