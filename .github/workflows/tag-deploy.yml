name: Legacy release workflow (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-release-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse the obsolete Android release path
        shell: bash
        run: |
          echo "This legacy job used Qt 6.4, API 23, Java 11 and a debug keystore." >&2
          echo "Use the receipt-gated Build-Android matrix in deploy.yml." >&2
          exit 1
