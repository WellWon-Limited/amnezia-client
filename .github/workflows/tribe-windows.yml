name: 'Tribe Windows'

# AVPN: наш workflow (BUILD-WINDOWS.md фаза W1, задействован 2026-07-29 после
# отказа от Parallels-VM). Минимальная адаптация апстримовского Build-Windows
# из deploy.yml: без апстрим-секретов и WiX, только IFW-инсталлер.
# Версия — из tribe_version.cmake (единый источник).

on:
  push:
    branches:
      - ci-build

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-Windows:
    runs-on: windows-latest

    env:
      QT_VERSION: 6.10.1

    steps:
    - name: 'Get sources'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@b7840a6733f49e2a39c4355260d2375063d39b61 # v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        tools: 'tools_ifw'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup msvc'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      with:
        arch: 'x64'

    - name: 'Setup python'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Materialize LICENSE symlink'
      shell: cmd
      run: |
        del deploy\data\LICENSE.txt
        copy /Y LICENSE deploy\data\LICENSE.txt

    - name: 'Build project'
      shell: cmd
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: deploy\build.bat --installer ifw

    - name: 'Upload IFW installer artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: tribe-windows-installer
        path: deploy/build/*_windows_x64.exe
        archive: false
        retention-days: 7
