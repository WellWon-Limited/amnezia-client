name: 'Tribe Windows'

# AVPN: наш workflow (BUILD-WINDOWS.md фаза W1, задействован 2026-07-29 после
# отказа от Parallels-VM). Минимальная адаптация апстримовского Build-Windows
# из deploy.yml: без апстрим-секретов и WiX, только IFW-инсталлер.
# Версия — из tribe_version.cmake (единый источник).

on:
  push:
    branches:
      - ci-build
  # ручной запуск: пересобрать exe, если артефакт (живёт 7 дней) истёк невыложенным
  workflow_dispatch:

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-Windows:
    runs-on: windows-latest

    env:
      QT_VERSION: 6.10.1

    steps:
    - name: 'Get sources'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Setup python'
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: 3.14

    - name: 'Install Qt'
      shell: pwsh
      run: |
        python -m pip install setuptools wheel "py7zr==0.22.*" "aqtinstall==3.3.0"
        python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 --outputdir "${{ runner.temp }}/Qt" --modules qtremoteobjects qt5compat qtshadertools --base $env:QT_MIRROR
        python -m aqt install-tool windows desktop tools_ifw --outputdir "${{ runner.temp }}/Qt" --base $env:QT_MIRROR

    - name: 'Setup msvc'
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      with:
        arch: 'x64'

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Materialize LICENSE symlink'
      shell: cmd
      run: |
        del deploy\data\LICENSE.txt
        copy /Y LICENSE deploy\data\LICENSE.txt

    - name: 'Build project'
      shell: cmd
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: deploy\build.bat --installer ifw

    - name: 'Upload IFW installer artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: tribe-windows-installer
        path: deploy/build/*_windows_x64.exe
        archive: false
        retention-days: 7

    # The next two steps launch the built GUI (update smoke and first-run screenshot). A launched
    # Tribe enrols on its own (POST /v1/trial) and later uploads crash reports; against production
    # every push created a real trial account and an os=server2025 device plus a dirty_exit report
    # (incident review 06.11). From here on the runner is cut off from the control plane:
    #  - AVPN_API_URL (via GITHUB_ENV: every later step and every process it starts inherits it)
    #    points the app at a closed loopback port, so enrolment and crash upload have nowhere to go;
    #  - the compiled-in API entries (kBakedEdges in AvpnEngineQml.cpp) are sunk in hosts: after
    #    three failures ConfigService edge-walks to them even with AVPN_API_URL set, and an app
    #    started without this env (installer, old build) would use them directly.
    # The first screen (onboarding) needs no network: the screenshot and the window check work offline.
    # The site tribevpn.com stays reachable: the smoke test downloads the published installer from it.
    - name: 'Cut the runner off the production API'
      shell: pwsh
      run: |
        $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
        $names = 'api.tribevpn.com', 'vpn.wellwon.hk'
        $lines = foreach ($n in $names) { "0.0.0.0 $n"; "::1 $n" }
        Add-Content -Path $hosts -Encoding ascii -Value (@('', '# tribe-windows CI: no production API') + $lines)
        ipconfig /flushdns | Out-Null
        foreach ($n in $names) {
          try { $ips = @([System.Net.Dns]::GetHostAddresses($n) | ForEach-Object { $_.ToString() }) } catch { $ips = @() }
          Write-Host "$n -> $($ips -join ', ')"
          $leak = @($ips | Where-Object { $_ -notin '0.0.0.0', '::1' })
          if ($leak.Count -gt 0) { throw "$n still resolves to $($leak -join ', ')" }
        }
        Add-Content -Path $env:GITHUB_ENV -Value 'AVPN_API_URL=http://127.0.0.1:9'

    # Смоук инсталлера: обновление поверх версии с сайта, переустановка, удаление, имя TribeVPN.exe;
    # служба оригинальной Amnezia рядом не трогается. Красный шаг = exe НЕ выкладывать на /dl/.
    - name: 'Installer smoke test'
      shell: pwsh
      timeout-minutes: 45
      run: |
        $exe = (Get-ChildItem deploy/build/*_windows_x64.exe | Select-Object -First 1).FullName
        ./deploy/tribe/windows-installer-smoke.ps1 -Installer $exe

    # Первый запуск после установки: онбординг на маленьком экране раннера (1024x768) — окно
    # целиком в рабочей области. Снимок экрана — артефакт tribe-windows-first-run.
    - name: 'First-run UI screenshot'
      shell: pwsh
      timeout-minutes: 5
      run: ./deploy/tribe/windows-ui-screenshot.ps1 -OutDir "${{ runner.temp }}/ui-shot"

    - name: 'Upload first-run screenshot'
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: tribe-windows-first-run
        path: ${{ runner.temp }}/ui-shot/first-run.png
        retention-days: 7
