patches:
  "3.1.4-tribe.12":
    # + 0015: WireGuardAdapter.tribeBackendWillRestart, an optional callback run synchronously right
    # before the adapter stops, pauses, replaces or rebinds its backend (TribeBackendRestart in
    # TribeRoaming.swift); nil = no call. The provider stops its probe sessions there.
    # + 0014: the Scanner's AmneziaWG mini-session runner (package tribeawg + api-tribescan-awg.go,
    # which hands it to 0013's engine host): a userspace device on an in-memory netstack with its own
    # registry and logger; awg_mini in scan_caps (2 at once on iOS, 4 on the macOS NE). No new export.
    # + 0013: the Scanner's probe engine exports LibXrayTribeScanMessage / LibXrayTribeScanStopAll
    # (ABI libxray-tribe-scan-v1, api-tribescan.go + api-tribescan-log.go + tribescan_ios.go /
    # tribescan_other.go + their host test, declarations in wireguard.h). The engine itself (package tribescan/) is the shared
    # ../amnezia-libxray/patches/0012-tribe-scan-engine.patch and core 0011 makes the dialer state
    # per instance; both are applied in build() and therefore not listed here. Slot 0012 is the
    # data watch branch's; rebased onto it this version becomes 3.1.4-tribe.14.
    # + 0011: LibXrayTribeOutboundStats (C export of libxray 0007; core 0008 counts the buffered
    # first write of a stream outbound).
    # tribe.11 (all unchanged) + 0010: LibXrayTribeHTTP, one HTTPS request through the running
    # core's local SOCKS5 inbound (tribehttp.go + its host test, export in api-tribehttp.go,
    # declaration in wireguard.h). The Xray core moves to amnezia-xray-core v1.261101.0 (Go
    # 1.27.4) with ../amnezia-libxray/patches/0004-xray-core-261101-controller-errors.patch, and
    # ../amnezia-libxray/patches/0005-libxray-forcefree-once.patch (FreeOSMemory loop once per
    # process) + 0006-libxray-restore-runtime-on-stop.patch (StopXray restores GOGC and the memory
    # limit, parks the loop) go to the vendored libxray; all are applied in build() after
    # `go mod vendor` and are therefore not listed here.
    - patch_file: "patches/0001-tribe-dnsfwd-warmup-rebind.patch"
    - patch_file: "patches/0002-xray-socket-protection-result.patch"
    - patch_file: "patches/0003-tribe-seamless-roaming.patch"
    - patch_file: "patches/0005-tribe-bounded-recovery.patch"
    - patch_file: "patches/0006-tribe-persistent-heal-soft-restart.patch"
    - patch_file: "patches/0007-tribe-fresh-port-on-return.patch"
    - patch_file: "patches/0008-tribe-logger-context-loss-gate.patch"
    - patch_file: "patches/0009-tribe-userspace-direct-split.patch"
    - patch_file: "patches/0010-tribe-upstream-http.patch"
    - patch_file: "patches/0011-tribe-outbound-stats.patch"
    - patch_file: "patches/0013-tribe-scan-probe.patch"
    - patch_file: "patches/0014-tribe-scan-awg.patch"
    - patch_file: "patches/0015-tribe-backend-restart-hook.patch"
  "3.1.4-tribe.11":
    # tribe.10 (all unchanged) + 0009: userspace direct split. The TUN wrapper hands TCP/UDP packets
    # whose destination is in the list (wgSetDirectSplit, a CIDR file) to a gVisor stack that
    # terminates the app's connection and opens an ordinary extension socket outside the tunnel;
    # everything else goes to the WireGuard device untouched. The engine outlives a device
    # restart (soft restart keeps direct flows). Off unless the app configures it.
    # TribeRoaming.swift for this version = tribe/TribeRoaming.swift (same file as tribe.10).
    - patch_file: "patches/0001-tribe-dnsfwd-warmup-rebind.patch"
    - patch_file: "patches/0002-xray-socket-protection-result.patch"
    - patch_file: "patches/0003-tribe-seamless-roaming.patch"
    - patch_file: "patches/0005-tribe-bounded-recovery.patch"
    - patch_file: "patches/0006-tribe-persistent-heal-soft-restart.patch"
    - patch_file: "patches/0007-tribe-fresh-port-on-return.patch"
    - patch_file: "patches/0008-tribe-logger-context-loss-gate.patch"
    - patch_file: "patches/0009-tribe-userspace-direct-split.patch"
  "3.1.4-tribe.10":
    # tribe.9 (all unchanged) + 0008: the logger context handed to Go is an immortal box holding
    # only the log closure (upstream re-retained the adapter inside Go's callback and, when that
    # reference was the last one, deallocated it inside callLogger: 2 NE crashes 121/122); the
    # roam fresh port needs a real loss (first handshake seen, upstream grace window elapsed);
    # the pending fresh-port flag is cleared even when the adapter is not started.
    # TribeRoaming.swift for this version = tribe/TribeRoaming.swift (conanfile.py).
    - patch_file: "patches/0001-tribe-dnsfwd-warmup-rebind.patch"
    - patch_file: "patches/0002-xray-socket-protection-result.patch"
    - patch_file: "patches/0003-tribe-seamless-roaming.patch"
    - patch_file: "patches/0005-tribe-bounded-recovery.patch"
    - patch_file: "patches/0006-tribe-persistent-heal-soft-restart.patch"
    - patch_file: "patches/0007-tribe-fresh-port-on-return.patch"
    - patch_file: "patches/0008-tribe-logger-context-loss-gate.patch"
  "3.1.4-tribe.9":
    # tribe.8 (0001+0002+0003+0005+0006, all unchanged) + 0007: a path that returns after a real
    # loss or moves to another interface gets a FRESH local port + keepalive instead of the
    # same-port bump (field data 24-28.09: fresh port healed 31/82 stalls, bump 4/27); the roam
    # step is recorded in the recovery arbiter without restarting the stall clock. The stall
    # ladder (TribeRoaming.swift for this version = tribe/TribeRoaming.swift) is fresh port ->
    # soft restart -> 30/60/120 s backoff cycle; tribe.4-8 bumped first and `rearm` zeroed the
    # clock on every path event (~200/h on cellular), so the fresh port was rarely reached.
    - patch_file: "patches/0001-tribe-dnsfwd-warmup-rebind.patch"
    - patch_file: "patches/0002-xray-socket-protection-result.patch"
    - patch_file: "patches/0003-tribe-seamless-roaming.patch"
    - patch_file: "patches/0005-tribe-bounded-recovery.patch"
    - patch_file: "patches/0006-tribe-persistent-heal-soft-restart.patch"
    - patch_file: "patches/0007-tribe-fresh-port-on-return.patch"
  "3.1.4-tribe.8":
    # tribe.7 (0001+0002+0003+0005, all unchanged) + 0006: stall-watchdog stage 3 keeps healing
    # while the GUI sleeps (bump -> fresh port -> soft restart, backoff 30/60/120 s, through the
    # shared budget; U9), in-place backend soft restart on the same TUN fd without
    # setTunnelNetworkSettings (NE step + `soft_restart` provider message; U6), keepalive-only
    # export wgSendKeepalives after a fresh port (no second BindUpdate), episode re-armed after a
    # resume. TribeRoaming.swift for this version = tribe/TribeRoaming.swift (conanfile.py).
    - patch_file: "patches/0001-tribe-dnsfwd-warmup-rebind.patch"
    - patch_file: "patches/0002-xray-socket-protection-result.patch"
    - patch_file: "patches/0003-tribe-seamless-roaming.patch"
    - patch_file: "patches/0005-tribe-bounded-recovery.patch"
    - patch_file: "patches/0006-tribe-persistent-heal-soft-restart.patch"
  "3.1.4-tribe.7":
    # Bounded autonomous AWG recovery on top of the UNCHANGED tribe.5 roaming patch: one arbiter
    # (TribeRecoveryArbiter) asks the shared GUI/NE budget BEFORE the stall stage moves (a refusal
    # is retried, never burned), cooldown only between actions of the same kind, keepalive after
    # every fresh port, typed rebind result for the provider message (K4), NE-owned bootstrap
    # recovery, adaptive 1 s / 5 s watchdog cadence.  Patch slot 0004 is taken by the imported
    # amnezia-libxray core patch (applied to vendor/ in build()), hence 0005.
    # "3.1.4-tribe.6" was an unpublished review build (PR #14) that edited 0003 in place; it is
    # superseded by this entry and intentionally not reproducible from this recipe.
    - patch_file: "patches/0001-tribe-dnsfwd-warmup-rebind.patch"
    - patch_file: "patches/0002-xray-socket-protection-result.patch"
    - patch_file: "patches/0003-tribe-seamless-roaming.patch"
    - patch_file: "patches/0005-tribe-bounded-recovery.patch"
  "3.1.4-tribe.5":
