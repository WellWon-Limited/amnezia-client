patches:
  "3.1.5-tribe.22":
    # tribe.21's patches byte for byte + 0019 (device round air-G, 25.11): a new 5-tuple begins with the handshake.
    # 0019 is the adapter half (the roam after a real loss or to another interface restarts the backend in place
    # instead of listen_port=0 + a keepalive on the live device; performSocketOps loses those two operations);
    # TribeRoaming.swift is the other half (socketOps, no separate roam proof restart, no data without a
    # handshake, the verdict for the app counts from lasting data). 0019 is last: it is recorded on the adapter
    # as 0003-0017 leave it.
    # 0019 also holds the review of round 53: the in-place restart runs through TribeRestartDriver and a restart
    # whose retries are spent raises the engine-down fact (the app is told); no caller drops the restart's result.
