  "3.1.4-tribe.14":
    # tribe.12 (0001-0011 and 0013-0015, all unchanged, byte for byte) + the data watch, in two
    # patches of its own:
    # + 0012 (the slot tribe.12 left for it): the Go half. tribeprobe.go, a pass-through TUN wrapper
    # that sends one small DNS query THROUGH the tunnel and takes the reply off the write path (the
    # judge of the passive rule), its engine reads and host test, the wgTurnOn hook in api-apple.go
    # and the three declarations at the end of wireguard.h (below 0013's insertion point).
    # + 0016 (after 0015): the adapter half. WireGuardAdapter.swift feeds TribeDataWatch
    # (tribe/TribeDataWatch.swift, pure logic with its own build gate) on the existing stall tick,
    # exposes its snapshot and executes the arbiter's commands (heal, in-place switch of the peer).
    # The engine stop of an in-place switch runs through TribeBackendHook.before(.restart, ...) of
    # 0015, so the Scanner's probe sessions end first; tests/check_backend_hook.sh gates it.
    # Why two patches and not one in slot 0012: the recipe's patch tool (patch_ng) matches every
    # hunk at its recorded line number, without offsets. 0015 was recorded on an adapter without
    # the data watch, so no line may be added to WireGuardAdapter.swift before it; the adapter
    # half therefore comes after it. The Go half adds nothing above a later hunk.
    # Off unless the app's plan file switches it on: a device without the probe configured reads
    # the tunnel exactly as tribe.12. TribeRoaming.swift = tribe/TribeRoaming.swift (tribe.12's
    # file plus requestPeerSwitch, which only the data watch calls).
    # 3.1.4-tribe.13 was the data watch branch's own number before this merge (tribe.11 + 0012 as
    # one patch); it was never built outside that branch and is not kept here.
    - patch_file: "patches/0001-tribe-dnsfwd-warmup-rebind.patch"
    - patch_file: "patches/0002-xray-socket-protection-result.patch"
    - patch_file: "patches/0003-tribe-seamless-roaming.patch"
    - patch_file: "patches/0005-tribe-bounded-recovery.patch"
    - patch_file: "patches/0006-tribe-persistent-heal-soft-restart.patch"
    - patch_file: "patches/0007-tribe-fresh-port-on-return.patch"
    - patch_file: "patches/0008-tribe-logger-context-loss-gate.patch"
    - patch_file: "patches/0009-tribe-userspace-direct-split.patch"
    - patch_file: "patches/0010-tribe-upstream-http.patch"
    - patch_file: "patches/0011-tribe-outbound-stats.patch"
    - patch_file: "patches/0012-tribe-data-watch.patch"
    - patch_file: "patches/0013-tribe-scan-probe.patch"
    - patch_file: "patches/0014-tribe-scan-awg.patch"
