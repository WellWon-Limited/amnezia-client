# Block all DNS traffic
block return out proto { tcp, udp } to port 53 flags any no state

# Allow our DNS servers - only through a tunnel interface, never the physical network.
# AVPN (round mac-C, review N1): this file is the fallback of a session whose tun is unknown; a session with its own
# tun writes the same rules with "on <its tun>" (macospfanchors.h dnsSessionRules). Without "on", a socket bound to
# the physical interface (IP_BOUND_IF: mDNSResponder's scoped queries, any app) sent DNS to these servers in clear
# whenever a route scoped to that interface existed - an own Xray session always, the Scanner during a scan.
utunInterfaces = "{                                                                         \
    utun0, utun1, utun2, utun3, utun4, utun5, utun6, utun7, utun8, utun9,   utun10,         \
    utun11, utun12, utun13, utun14, utun15, utun16, utun17, utun18, utun19, utun20,         \
    utun21, utun22, utun23, utun24, utun25, utun26, utun27, utun28, utun29, utun30          \
}"
table <dnsaddr> {}
pass out on $utunInterfaces proto { tcp, udp } to <dnsaddr> port 53 flags any no state
